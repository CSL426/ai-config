[package]
name = "acg"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tempfile = "3.16"

[[bin]]
name = "acg"
path = "src/main.rs"

[lib]
name = "acg"
path = "src/lib.rs"
