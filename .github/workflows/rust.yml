name: Rust CI

on:
  push:
    branches:
      - main
      - "rust/**"
    paths:
      - "rust/**"
      - "ai_config/handoff.py"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "ai_config/handoff.py"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        run: rustup default stable && rustup component add clippy

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install pytest PyYAML

      - name: Run cargo test
        run: cargo test --locked --manifest-path rust/Cargo.toml

      - name: Run cargo clippy
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
