name: Standalone Release

on:
  # Tags only. A release commit lands on main and is tagged at the same SHA, so
  # keeping a branch trigger here built every release twice.
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "ai_config/**"
      - "scripts/standalone_entry.py"
      - "tests/**"
      - "pyproject.toml"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/standalone-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish after rebuilding release assets
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest PyYAML ruff

      - name: Run tests
        run: python -m pytest tests/

      - name: Run static checks
        run: ruff check ai_config tests scripts/standalone_entry.py

      - name: Check installer syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh

  build:
    name: ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            source: dist/ai-config
            asset: ai-config-linux-x86_64
          - os: ubuntu-22.04-arm
            source: dist/ai-config
            asset: ai-config-linux-aarch64
          - os: windows-latest
            source: dist/ai-config.exe
            asset: ai-config-windows-x86_64.exe
            # Windows 是唯一內建 GUI 的組建:pywebview 走系統的 WebView2,
            # 不必打包瀏覽器;Linux/macOS 需要額外的 GTK/Cocoa 執行期依賴。
            extra_args: >-
              --icon assets/icon.ico
              "--add-data=ai_config/gui_assets;gui_assets"
              --hidden-import webview.platforms.winforms
            with_gui: "true"
          - os: macos-15-intel
            source: dist/ai-config
            asset: ai-config-macos-x86_64
            extra_args: "--icon assets/icon.icns"
          - os: macos-14
            source: dist/ai-config
            asset: ai-config-macos-arm64
            extra_args: "--icon assets/icon.icns"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Google Drive 登入需要的 OAuth client ID(非機密,但不進版控):
      # 從 repo secret 注入原始碼常數;沒設 secret 時照常建置,執行檔會提示
      # 改用 AI_CONFIG_GDRIVE_CLIENT_ID 環境變數。
      - name: Inject Google OAuth client ID
        shell: bash
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.AI_CONFIG_GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.AI_CONFIG_GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -n "$GDRIVE_CLIENT_ID" ]; then
            sed -i.bak 's/^GDRIVE_CLIENT_ID = ""/GDRIVE_CLIENT_ID = "'"$GDRIVE_CLIENT_ID"'"/' ai_config/gdrive.py
            grep -q "$GDRIVE_CLIENT_ID" ai_config/gdrive.py
            echo "Client ID injected"
          else
            echo "No AI_CONFIG_GDRIVE_CLIENT_ID secret; building without an embedded client ID"
          fi
          if [ -n "$GDRIVE_CLIENT_SECRET" ]; then
            sed -i.bak 's/^GDRIVE_CLIENT_SECRET = ""/GDRIVE_CLIENT_SECRET = "'"$GDRIVE_CLIENT_SECRET"'"/' ai_config/gdrive.py
            grep -q "$GDRIVE_CLIENT_SECRET" ai_config/gdrive.py
            echo "Client secret injected"
          else
            echo "No AI_CONFIG_GDRIVE_CLIENT_SECRET secret; Google Desktop clients need it for the token exchange"
          fi
          rm -f ai_config/gdrive.py.bak

      - name: Set up Node
        if: matrix.with_gui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm 版本釘死:package.json 沒有 packageManager 欄位,靠 corepack 的
      # 預設值會隨 Node 版本漂移,而 lockfileVersion 9 需要 pnpm 9 以上。
      - name: Set up pnpm
        if: matrix.with_gui == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Build GUI frontend
        if: matrix.with_gui == 'true'
        shell: bash
        run: |
          cd gui
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../ai_config/gui_assets/index.html

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.21.0 .

      - name: Install GUI runtime
        if: matrix.with_gui == 'true'
        run: python -m pip install ".[gui]"

      - name: Build standalone executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile
          --name ai-config --hidden-import ai_config.__main__
          --copy-metadata ai-config
          ${{ matrix.extra_args }}
          scripts/standalone_entry.py

      - name: Name asset and write checksum
        env:
          SOURCE: ${{ matrix.source }}
          ASSET: ${{ matrix.asset }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE"])
          asset = source.with_name(os.environ["ASSET"])
          source.replace(asset)
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          asset.with_name(f"{asset.name}.sha256").write_text(
              f"{digest}  {asset.name}\n",
              encoding="utf-8",
          )

      - name: Verify standalone help
        env:
          ASSET: ${{ matrix.asset }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          executable = Path("dist") / os.environ["ASSET"]
          result = subprocess.run(
              [str(executable.resolve()), "help"],
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          raise SystemExit(result.returncode)

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
