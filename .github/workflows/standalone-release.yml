name: Standalone Release

on:
  # Tags only. A release commit lands on main and is tagged at the same SHA, so
  # keeping a branch trigger here built every release twice.
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "ai_config/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "install.sh"
      - "install.ps1"
      - "launcher/**"
      - ".github/workflows/standalone-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish after rebuilding release assets
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest PyYAML ruff

      - name: Run tests
        run: python -m pytest tests/

      - name: Run static checks
        run: ruff check ai_config tests scripts/standalone_entry.py

      - name: Check installer syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh

      - name: Test the launcher
        run: cargo test --manifest-path launcher/Cargo.toml

  build:
    name: ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: ai-config-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: ai-config-linux-aarch64
          - os: windows-latest
            asset: ai-config-windows-x86_64
            # Windows 是唯一內建 GUI 的組建:pywebview 走系統的 WebView2,
            # 不必打包瀏覽器;Linux/macOS 需要額外的 GTK/Cocoa 執行期依賴。
            extra_args: >-
              --icon assets/icon.ico
              "--add-data=ai_config/gui_assets;gui_assets"
              --hidden-import webview.platforms.winforms
            with_gui: "true"
          - os: macos-15-intel
            asset: ai-config-macos-x86_64
            extra_args: "--icon assets/icon.icns"
          - os: macos-14
            asset: ai-config-macos-arm64
            extra_args: "--icon assets/icon.icns"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Google Drive 登入需要的 OAuth client ID(非機密,但不進版控):
      # 從 repo secret 注入原始碼常數;沒設 secret 時照常建置,執行檔會提示
      # 改用 AI_CONFIG_GDRIVE_CLIENT_ID 環境變數。
      - name: Inject Google OAuth client ID
        shell: bash
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.AI_CONFIG_GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.AI_CONFIG_GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -n "$GDRIVE_CLIENT_ID" ]; then
            sed -i.bak 's/^GDRIVE_CLIENT_ID = ""/GDRIVE_CLIENT_ID = "'"$GDRIVE_CLIENT_ID"'"/' ai_config/gdrive_auth.py
            grep -q "$GDRIVE_CLIENT_ID" ai_config/gdrive_auth.py
            echo "Client ID injected"
          else
            echo "No AI_CONFIG_GDRIVE_CLIENT_ID secret; building without an embedded client ID"
          fi
          if [ -n "$GDRIVE_CLIENT_SECRET" ]; then
            sed -i.bak 's/^GDRIVE_CLIENT_SECRET = ""/GDRIVE_CLIENT_SECRET = "'"$GDRIVE_CLIENT_SECRET"'"/' ai_config/gdrive_auth.py
            grep -q "$GDRIVE_CLIENT_SECRET" ai_config/gdrive_auth.py
            echo "Client secret injected"
          else
            echo "No AI_CONFIG_GDRIVE_CLIENT_SECRET secret; Google Desktop clients need it for the token exchange"
          fi
          rm -f ai_config/gdrive_auth.py.bak

      - name: Set up Node
        if: matrix.with_gui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm 版本釘死:package.json 沒有 packageManager 欄位,靠 corepack 的
      # 預設值會隨 Node 版本漂移,而 lockfileVersion 9 需要 pnpm 9 以上。
      - name: Set up pnpm
        if: matrix.with_gui == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Build GUI frontend
        if: matrix.with_gui == 'true'
        shell: bash
        run: |
          cd gui
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../ai_config/gui_assets/index.html

      - name: Embed build commit
        env:
          BUILD_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          commit = os.environ["BUILD_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", commit):
              raise SystemExit("Invalid build commit")
          Path("ai_config/_build.py").write_text(
              f'"""Build metadata embedded during packaging."""\n\nCOMMIT_SHA = "{commit}"\n',
              encoding="utf-8",
          )

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.21.0 .

      - name: Install GUI runtime
        if: matrix.with_gui == 'true'
        run: python -m pip install ".[gui]"

      # onedir:onefile 每次啟動都把執行期解壓到暫存目錄,執行中又回頭從自己的
      # 檔案讀模組,檔案一被換掉就壞(docs/onedir-launcher-plan.md)
      - name: Build standalone executable
        run: >-
          python -m PyInstaller --clean --noconfirm --onedir
          --name ai-config --hidden-import ai_config.__main__
          --copy-metadata ai-config
          ${{ matrix.extra_args }}
          scripts/standalone_entry.py

      # 給下載後直接雙擊的人:單一檔案、不必安裝。安裝腳本不用它
      - name: Build the portable Windows executable
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --onefile
          --name acg --workpath build-portable --distpath dist-portable
          --hidden-import ai_config.__main__
          --copy-metadata ai-config
          ${{ matrix.extra_args }}
          scripts/standalone_entry.py

      - name: Build the Windows launcher
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path launcher/Cargo.toml

      - name: Package release assets
        env:
          ASSET: ${{ matrix.asset }}
        shell: python
        run: |
          import hashlib
          import os
          import shutil
          import tarfile
          from pathlib import Path

          asset = os.environ["ASSET"]
          out = Path("release")
          out.mkdir()
          packaged = []
          if os.name == "nt":
              archive = shutil.make_archive(str(out / asset), "zip", root_dir="dist", base_dir="ai-config")
              packaged.append(Path(archive))
              launcher = out / "ai-config-launcher-windows-x86_64.exe"
              shutil.copy2("launcher/target/release/ai-config.exe", launcher)
              packaged.append(launcher)
              portable = out / "acg.exe"
              shutil.copy2("dist-portable/acg.exe", portable)
              packaged.append(portable)
          else:
              archive = out / f"{asset}.tar.gz"
              with tarfile.open(archive, "w:gz") as tar:
                  tar.add("dist/ai-config", arcname="ai-config")
              packaged.append(archive)
          for path in packaged:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              Path(f"{path}.sha256").write_text(f"{digest}  {path.name}\n", encoding="utf-8")
              print(f"{path.name}  {path.stat().st_size // 1024} KiB")

      # 經由真正裝好的樣子啟動:Windows 走 PATH 上的啟動器,其他平台走 symlink
      - name: Install into a scratch layout
        id: layout
        shell: python
        run: |
          import os
          import shutil
          import tempfile
          from pathlib import Path

          share = Path(tempfile.mkdtemp()) / "share"
          version = share / "versions" / "0.0.0" / "app"
          shutil.copytree("dist/ai-config", version)
          (share / "versions" / "active").write_text("0.0.0\n", encoding="utf-8")
          if os.name == "nt":
              entry = share.parent / "ai-config.exe"
              shutil.copy2("release/ai-config-launcher-windows-x86_64.exe", entry)
          else:
              entry = share.parent / "ai-config"
              entry.symlink_to(version / "ai-config")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"share={share}\nentry={entry}\n")

      - name: Verify standalone help
        env:
          AI_CONFIG_SHARE_DIR: ${{ steps.layout.outputs.share }}
          ENTRY: ${{ steps.layout.outputs.entry }}
        shell: python
        run: |
          import os
          import subprocess

          result = subprocess.run([os.environ["ENTRY"], "help"], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          raise SystemExit(result.returncode)

      # 真的裝一次、跑、退回舊版再切回來;macOS 沒有實機,這是它唯一的實測
      - name: End-to-end install
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
        run: bash scripts/e2e-install.sh "release/$ASSET.tar.gz" install.sh

      # Windows PowerShell 5.1,跟使用者手上的一樣;runner 沒有人看視窗,略過 GUI
      - name: End-to-end install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\e2e-install.ps1
          -Archive release\ai-config-windows-x86_64.zip
          -Launcher release\ai-config-launcher-windows-x86_64.exe
          -Portable release\acg.exe -Installer install.ps1 -NoGui

      # 用真的執行檔當 git 的 credential helper 跑一遍:python.exe 測不到
      # onefile 主控台判斷之類只有打包後才會發生的事
      - name: Verify the executable as a git credential helper
        env:
          AI_CONFIG_SHARE_DIR: ${{ steps.layout.outputs.share }}
          ENTRY: ${{ steps.layout.outputs.entry }}
        shell: python
        run: |
          import os
          import shlex
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          executable = Path(os.environ["ENTRY"])
          work = Path(tempfile.mkdtemp())
          repo = work / "repo"
          repo.mkdir()
          subprocess.run(["git", "-C", str(repo), "init", "-q"], check=True)
          fake_bin = work / "bin"
          fake_bin.mkdir()
          if os.name == "nt":
              (fake_bin / "gh.cmd").write_text("@echo off\r\necho gho_fake_token\r\n")
              helper_path = executable.as_posix()
          else:
              script = fake_bin / "gh"
              script.write_text("#!/bin/sh\necho gho_fake_token\n")
              script.chmod(0o755)
              helper_path = str(executable)
          helper = "!" + shlex.quote(helper_path) + " __git-credential CSL426"
          subprocess.run(["git", "-C", str(repo), "config", "--local", "--replace-all", "credential.helper", ""], check=True)
          subprocess.run(["git", "-C", str(repo), "config", "--local", "--add", "credential.helper", helper], check=True)
          env = {**os.environ, "PATH": str(fake_bin) + os.pathsep + os.environ["PATH"], "GIT_TERMINAL_PROMPT": "0"}
          result = subprocess.run(
              ["git", "-C", str(repo), "credential", "fill"],
              input="protocol=https\nhost=github.com\n\n",
              capture_output=True,
              text=True,
              env=env,
              timeout=180,
          )
          print(result.stdout.replace("gho_fake_token", "***"))
          print(result.stderr, file=sys.stderr)
          if result.returncode != 0 or "password=gho_fake_token" not in result.stdout:
              raise SystemExit("credential helper smoke test failed")
          if result.stdout.strip().splitlines()[-1] != "password=gho_fake_token":
              raise SystemExit("helper wrote extra lines after the credential")

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      # 安裝腳本跟執行檔一起發,新機器與 acg update 才拿得到同一版的腳本
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: source

      - name: Add the installers
        run: cp source/install.sh source/install.ps1 release-assets/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
